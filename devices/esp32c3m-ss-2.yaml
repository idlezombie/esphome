esphome:
  name: esp32c3m-ss-2
  friendly_name: "Air Conditioner"

esp32:
  variant: ESP32C3
  framework:
    type: esp-idf

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_key

wifi:
  domain: .iot.rtgb.id.au
  power_save_mode: none
  fast_connect: True
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password

logger:

external_components:
  - source: github://idlezombie/esphome@actron_modbus
    components: [actron_modbus]
    refresh: 0s

# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓ #
# ┃ esp32 Modbus Interface Config ┃ #
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛ #

uart:
  id: uart_1
  rx_pin: GPIO20
  tx_pin: GPIO21
  baud_rate: 9600
  parity: NONE
  stop_bits: 1

modbus:
  id: modbus_1
  uart_id: uart_1
  send_wait_time: 100ms

# Two controllers, same slave address (ESPHome 2026.8+): climate/zones get a quiet
# bus most of the time; diagnostics poll slowly on their own cadence.
modbus_controller:
  - id: actron_ac
    address: 1
    modbus_id: modbus_1
    # No sensors on this controller — climate/zones queue commands themselves.
    update_interval: never

  - id: actron_diag
    address: 1
    modbus_id: modbus_1
    update_interval: 60s

climate:
  - platform: actron_modbus
    name: "Climate"
    modbus_controller_id: actron_ac
    power_register: 1
    fan_register: 4
    mode_register: 101
    setpoint_register: 102
    continuous_fan_register: 105
    room_temp_register: 851
    command_interval: 200ms
    optimistic: true
    update_interval: 4s
    read_timeout: 3s
    room_temp_every: 3

# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓ #
# ┃ Actron ICAMID-MOD Modbus Register Map ┃ #
# ┃  Classic Series - Usable Values Only  ┃ #
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛ #

# Control

#------------------------------------------
switch:
  - platform: actron_modbus
    modbus_controller_id: actron_ac
    name: "Zone: Upstairs"
    id: ac_raw_zone_upstairs
    address: 5001
    bitmask: 0x0001
    optimistic: true
    settle_timeout: 5s
    update_interval: 15s

  - platform: actron_modbus
    modbus_controller_id: actron_ac
    name: "Zone: Downstairs"
    id: ac_raw_zone_downstairs
    address: 5002
    bitmask: 0x0001
    optimistic: true
    settle_timeout: 5s
    update_interval: 15s

#------------------------------------------
sensor:
  - platform: modbus_controller
    modbus_controller_id: actron_diag
    name: "Fan Speed Demand"
    id: ac_raw_fan_speed_demand
    entity_category: diagnostic
    register_type: holding
    address: 703
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 1
    lambda: |-
      return (x * 0.1);
    filters:
      - throttle_average: 30s

  - platform: modbus_controller
    modbus_controller_id: actron_diag
    name: "Indoor Coil Temperature"
    id: ac_raw_coil_temp
    entity_category: diagnostic
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    register_type: holding
    address: 1301
    value_type: U_WORD
    lambda: |-
      return (x * 0.1);
    filters:
      - throttle_average: 30s

  - platform: modbus_controller
    modbus_controller_id: actron_diag
    name: "Raw Indoor Comms Register"
    internal: true
    id: ac_raw_indoor_comms
    unit_of_measurement: ""
    accuracy_decimals: 0
    register_type: holding
    address: 906
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: actron_diag
    name: "Compressor Demand"
    id: ac_raw_compressor_demand
    entity_category: diagnostic
    unit_of_measurement: "%"
    accuracy_decimals: 1
    register_type: holding
    address: 1104
    value_type: U_WORD
    lambda: |-
      return x * 0.1;
    filters:
      - throttle_average: 30s

binary_sensor:
  - platform: template
    name: "Indoor Unit Comms Status"
    id: ac_indoor_comms
    entity_category: diagnostic
    device_class: problem
    lambda: |-
      if (id(ac_raw_indoor_comms).state == 0) {
        return false;
      } else {
        return true;
      }
